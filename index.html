<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="可離線使用的影視資料庫，支援搜尋、篩選、收藏及觀看狀態。"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>J.Law 影視資料庫</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c2f;--panel2:#1b2740;--text:#eef3ff;--muted:#aab7d0;--line:#2d3a55;--accent:#8bb7ff;--accent2:#c0d7ff;--good:#9be2c0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#10182b,var(--bg) 360px);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,select{font:inherit}button,.filebtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:12px;cursor:pointer;min-height:42px}button.primary,.filebtn.primary{background:var(--accent);color:#0b1426;border-color:transparent;font-weight:700}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}header{padding:24px max(16px,calc((100vw - 1240px)/2)) 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:.02em}header p{color:var(--muted);margin:4px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.action-menu{position:relative;z-index:20}.action-menu>summary{list-style:none;cursor:pointer;user-select:none;border:1px solid var(--line);background:linear-gradient(135deg,#233453,#17243b);color:var(--text);padding:11px 16px;border-radius:13px;font-weight:650;min-height:44px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px #0002}.action-menu>summary::-webkit-details-marker{display:none}.action-menu>summary:hover{border-color:var(--accent);background:#263a5b}.menu-caret{color:var(--accent);transition:transform .18s}.action-menu[open] .menu-caret{transform:rotate(180deg)}.action-panel{position:absolute;right:0;top:calc(100% + 9px);width:min(310px,calc(100vw - 28px));padding:10px;background:#111b2e;border:1px solid #354766;border-radius:16px;box-shadow:0 18px 48px #0009;display:grid;gap:7px;max-height:min(75vh,560px);overflow:auto}.menu-heading{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:5px 7px 1px}.menu-action,.action-panel .filebtn{width:100%;display:flex;align-items:center;justify-content:flex-start;text-align:left;gap:9px;padding:10px 12px;min-height:42px;border-radius:10px;font-size:14px;text-decoration:none}.menu-action:hover,.action-panel .filebtn:hover{border-color:#5e7aa5;background:#263753}.action-panel .primary{background:var(--accent);color:#0b1426;border-color:transparent;font-weight:700}.menu-divider{height:1px;background:var(--line);margin:3px 4px}.wrap{max-width:1240px;margin:auto;padding:0 16px 48px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 16px}.stat,.filters,.toolbar,.item{background:rgba(20,28,47,.94);border:1px solid var(--line);border-radius:16px}.stat{padding:13px 15px}.stat strong{font-size:23px;display:block}.stat span{font-size:12px;color:var(--muted)}.filters{padding:16px;margin-bottom:14px}.filtergrid{display:grid;grid-template-columns:2fr repeat(4,minmax(120px,1fr));gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select{width:100%;background:#0d1527;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;min-height:43px}.filterfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}.checkline{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}.checkline label{display:flex;align-items:center;gap:7px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;margin-bottom:12px;flex-wrap:wrap}.toolbar .left,.toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select{background:#0d1527;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{padding:15px;min-width:0;display:flex;flex-direction:column;gap:8px}.item h2{font-size:18px;line-height:1.35;margin:0;overflow-wrap:anywhere}.original{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;color:var(--accent2);border:1px solid #344a6b;background:#192943;padding:3px 8px;border-radius:999px}.details{font-size:13px;color:var(--muted);display:grid;gap:5px}.details b{color:#e6edfb;font-weight:600}.locations{border-top:1px solid var(--line);padding-top:9px;margin-top:auto;display:grid;gap:5px;font-size:13px}.cardactions{display:flex;gap:7px;margin-top:4px}.cardactions button{flex:1;font-size:13px;padding:7px 8px;min-height:38px}.on{color:var(--good)!important;border-color:#396f5d!important}.empty{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}.notice{font-size:12px;color:var(--muted);margin:12px 2px}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}.filebtn{display:inline-flex;align-items:center;justify-content:center}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e8f0ff;color:#111827;border-radius:12px;padding:10px 16px;box-shadow:0 8px 30px #0008;z-index:5;max-width:90vw}
@media(max-width:900px){.filtergrid{grid-template-columns:repeat(3,minmax(0,1fr))}.filtergrid .searchfield{grid-column:1/-1}.results{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){header{padding:18px 14px 14px;align-items:flex-start;flex-wrap:nowrap;gap:8px}header>div{flex:1;min-width:0}h1{font-size:21px;line-height:1.3}.action-menu{flex:0 0 auto;margin-left:0}.action-menu>summary{font-size:13px;padding:9px 10px;gap:6px;white-space:nowrap;min-height:40px}.action-panel{right:0}.wrap{padding:0 12px 32px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:19px}.stat span{font-size:11px}.filtergrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.filtergrid .searchfield{grid-column:1/-1}.filters{padding:12px}.results{grid-template-columns:1fr;gap:9px}.item{padding:14px}.toolbar{align-items:flex-start}.toolbar .left,.toolbar .right{width:100%;justify-content:space-between}.toolbar .right select{flex:1;min-width:0}.toolbar button{flex:1}.item h2{font-size:18px}.notice{line-height:1.5}}
</style></head>
<body><header><div><h1>🎬 J.Law 影視資料庫</h1><p>搜尋、篩選、管理你的劇集與備份位置</p></div><details class="action-menu"><summary aria-label="開啟資料管理清單">☰ 資料管理 <span class="menu-caret">▾</span></summary><div class="action-panel"><div class="menu-heading">資料管理</div><button class="menu-action" id="updateCsvBtn" type="button">🔄 更新雲端作品清單</button><button class="menu-action primary" id="fullExportBtn" type="button">🗃️ 匯出完整備份（含收藏）</button><label class="filebtn menu-action" for="backupJsonInput">📥 匯入完整備份（JSON）</label><input id="backupJsonInput" type="file" accept=".json,application/json" style="display:none"><div class="menu-divider"></div><div class="menu-heading">Supabase 雲端備份</div><button class="menu-action" id="supabaseConfigBtn">⚙️ Supabase 設定</button><button class="menu-action primary" id="supabaseBackupBtn">☁️ 完整備份至 Supabase</button><button class="menu-action" id="supabaseRestoreBtn">⬇️ 匯入 Supabase 備份</button><button class="menu-action hidden" id="installBtn">📲 安裝 App</button></div></details></header>
<main class="wrap"><section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>資料庫作品</span></div><div class="stat"><strong id="shownCount">0</strong><span>目前篩選結果</span></div><div class="stat"><strong id="favCount">0</strong><span>我的收藏</span></div></section>
<section class="filters"><div class="filtergrid"><div class="field searchfield"><label for="search">關鍵字搜尋</label><input id="search" placeholder="劇名、原文、演員、類型、備份位置…" autocomplete="off"></div><div class="field"><label for="typeFilter">作品類型</label><select id="typeFilter"><option value="">全部作品類型</option></select></div><div class="field"><label for="actorFilter">演員／聲優</label><select id="actorFilter"><option value="">全部演員／聲優</option></select></div><div class="field"><label for="themeFilter">題材</label><select id="themeFilter"><option value="">全部題材</option></select></div><div class="field"><label for="languageFilter">語言</label><select id="languageFilter"><option value="">全部語言</option></select></div><div class="field"><label for="yearFilter">年份</label><select id="yearFilter"><option value="">全部年份</option></select></div></div><div class="filterfoot"><div class="checkline"><label><input id="favOnly" type="checkbox"> 只看收藏</label><label><input id="watchedOnly" type="checkbox"> 只看已觀看</label><label><input id="unwatchedOnly" type="checkbox"> 未觀看</label></div><button id="resetBtn">清除篩選</button></div></section>
<section class="toolbar"><div class="left"><span id="resultLabel">載入資料後開始使用</span></div><div class="right"><label for="sortSelect" class="hidden">排序</label><select id="sortSelect"><option value="title">按中文名稱排序</option><option value="yearDesc">年份：新到舊</option><option value="yearAsc">年份：舊到新</option><option value="episodesDesc">集數：多到少</option><option value="episodesAsc">集數：少到多</option></select><button id="viewBtn">切換列表</button></div></section>
<section id="results" class="results" aria-live="polite"></section><p class="notice">作品清單、收藏及觀看狀態均儲存在本機。請定期匯出「完整備份（JSON）」，或備份至 Supabase，避免清除瀏覽器資料後遺失。</p></main><footer>影視資料庫 PWA · 支援完整 JSON 備份及 Supabase 雲端備份 · 本機資料優先</footer><div id="toast" class="toast hidden" role="status"></div>
<script>
const DBKEY='dramalist_pwa_v1', METAKEY='dramalist_meta_v1';
const COLS=['中文名稱','英文名稱 / 原文名稱','類形','年份','集數','語言','主要演員 / 聲優','Media Type','Backup 1','backup 2'];
let rows=[],meta={},listView=false,installPrompt=null;
const $=id=>document.getElementById(id);
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2600)}
function norm(s){return String(s??'').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let out=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))out.push(row);row=[];cell=''}else cell+=c}if(cell!==''||row.length){row.push(cell);if(row.some(x=>x.trim()!==''))out.push(row)}if(!out.length)return[];const headers=out.shift().map(x=>x.trim());return out.map(a=>Object.fromEntries(headers.map((h,i)=>[h,norm(a[i])])))}
function get(r,key){return norm(r[key])}
function keyFor(r){return [get(r,COLS[0]),get(r,COLS[1]),get(r,COLS[3])].join('|').toLowerCase()}
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(rows));localStorage.setItem(METAKEY,JSON.stringify(meta))}catch(e){toast('本機儲存空間不足，請匯出資料備份')}}
function load(){try{rows=JSON.parse(localStorage.getItem(DBKEY)||'[]');meta=JSON.parse(localStorage.getItem(METAKEY)||'{}')}catch{rows=[];meta={}}}
function options(id,values,first){const sel=$(id),prev=sel.value;sel.innerHTML=`<option value="">${first}</option>`+[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true})).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if([...sel.options].some(o=>o.value===prev))sel.value=prev}
// 類形欄可能混有演員／其他標籤。重要：只認「完整標籤」符合清單的項目，不能用關鍵字包含判斷，否則愛情劇、校園劇等也會被錯當成作品大類。
const TYPE_ALIASES = new Map([
 ['電影','電影'],['電影版','電影'],['日影','電影'],['韓影','電影'],['港影','電影'],['台影','電影'],['國產電影','電影'],['movie','電影'],['movies','電影'],['film','電影'],['films','電影'],
 ['日劇','日劇'],['日本劇','日劇'],['韓劇','韓劇'],['韓國劇','韓劇'],['美劇','美劇'],['美國劇','美劇'],['台劇','台劇'],['台灣劇','台劇'],['港劇','港劇'],['香港劇','港劇'],['中劇','陸劇'],['陸劇','陸劇'],['中國劇','陸劇'],['泰劇','泰劇'],['英劇','英劇'],['法劇','法劇'],['德劇','德劇'],['網劇','網劇'],['電視劇','電視劇'],['短劇','短劇'],
 ['動畫','動畫'],['動漫','動畫'],['anime','動畫'],['ova','動畫'],['綜藝','綜藝'],['番組','綜藝'],['紀錄片','紀錄片'],['紀錄','紀錄片'],['特攝','特攝'],['舞台劇','舞台劇'],['劇場版','電影'],['tv show','電視節目'],['series','電視劇'],['drama','電視劇']
]);
function splitTags(v){return String(v||'').split(/[、,，;；|／\/]+/).map(x=>x.trim()).filter(Boolean)}
function canonicalType(tag){return TYPE_ALIASES.get(String(tag||'').trim().toLocaleLowerCase()) || TYPE_ALIASES.get(String(tag||'').trim()) || ''}
function typeTags(r){return [...new Set(splitTags(get(r,COLS[2])).map(canonicalType).filter(Boolean))]}
// 題材使用白名單，但以「包含關鍵字」比對，不要求資料表標籤完整對齊。
// 例如「愛情科幻」會同時命中「愛情」及「科幻」。
const THEME_ALIASES = [
 ['愛情',['愛情','浪漫','romance','romantic']],
 ['喜劇',['喜劇','搞笑','comedy']],
 ['科幻',['科幻','科學幻想','science fiction','sci-fi','scifi']],
 ['恐怖',['恐怖','horror']],
 ['驚悚',['驚悚','thriller']],
 ['動作',['動作','action']],
 ['冒險',['冒險','探險','之旅','adventure']],
 ['懸疑',['懸疑','mystery']],
 ['推理',['推理','偵探','detective']],
 ['犯罪',['犯罪','警匪','crime']],
 ['劇情',['劇情','drama']],
 ['奇幻',['奇幻','魔幻','fantasy']],
 ['歷史',['歷史','history']],
 ['古裝',['古裝','古代']],
 ['武俠',['武俠','功夫','wuxia']],
 ['戰爭',['戰爭','war']],
 ['災難',['災難','disaster']],
 ['家庭',['家庭','親情','family']],
 ['校園',['校園','學園','school']],
 ['青春',['青春','成長','coming of age']],
 ['職場',['職場','辦公室']],
 ['醫療',['醫療','醫院','medical']],
 ['政治',['政治','political']],
 ['音樂',['音樂','music']],
 ['歌舞',['歌舞','musical']],
 ['運動',['運動','體育','sports']],
 ['紀錄',['紀錄片','紀錄','documentary']],
 ['愛情喜劇',['愛情喜劇','romantic comedy','rom-com']]
];
function themeTags(r){const raw=get(r,COLS[2]).toLocaleLowerCase();if(!raw)return [];return [...new Set(THEME_ALIASES.filter(([name,aliases])=>aliases.some(alias=>raw.includes(alias.toLocaleLowerCase()))).map(([name])=>name))]}
// 演員／聲優選項只從專用欄位取得，避免把題材標籤混入演員清單；TVB 另歸入作品類型。
function actorTags(r){return [...new Set(splitTags(get(r,COLS[6])).map(x=>x.trim()).filter(x=>x&&!/^tvb$/i.test(x)))]}
function refreshOptions(){options('typeFilter',[...rows.flatMap(typeTags),...rows.flatMap(r=>splitTags(get(r,COLS[6])).filter(x=>/^tvb$/i.test(x)).map(()=> 'TVB'))],'全部作品類型');options('themeFilter',rows.flatMap(themeTags),'全部題材');options('actorFilter',rows.flatMap(actorTags),'全部演員／聲優');options('languageFilter',rows.map(r=>get(r,COLS[5])),'全部語言');options('yearFilter',rows.map(r=>get(r,COLS[3])),'全部年份')}
function isFav(r){return !!meta[keyFor(r)]?.fav}function isWatched(r){return !!meta[keyFor(r)]?.watched}
function filtered(){const q=$('search').value.trim().toLocaleLowerCase();let a=rows.filter(r=>{const all=COLS.map(k=>get(r,k)).join(' ').toLocaleLowerCase();const selectedType=$('typeFilter').value,selectedTheme=$('themeFilter').value,selectedActor=$('actorFilter').value;const rowTypes=[...typeTags(r),...(splitTags(get(r,COLS[6])).some(x=>/^tvb$/i.test(x))?['TVB']:[])];return(!q||all.includes(q))&&(!selectedType||rowTypes.includes(selectedType))&&(!selectedTheme||themeTags(r).includes(selectedTheme))&&(!selectedActor||actorTags(r).includes(selectedActor)||get(r,COLS[6]).includes(selectedActor))&&(!$('languageFilter').value||get(r,COLS[5])===$('languageFilter').value)&&(!$('yearFilter').value||get(r,COLS[3])===$('yearFilter').value)&&(!$('favOnly').checked||isFav(r))&&(!$('watchedOnly').checked||isWatched(r))&&(!$('unwatchedOnly').checked||!isWatched(r))});const s=$('sortSelect').value;a.sort((x,y)=>{if(s==='yearDesc')return (+get(y,COLS[3])||0)-(+get(x,COLS[3])||0);if(s==='yearAsc')return (+get(x,COLS[3])||0)-(+get(y,COLS[3])||0);if(s==='episodesDesc')return (+get(y,COLS[4])||0)-(+get(x,COLS[4])||0);if(s==='episodesAsc')return (+get(x,COLS[4])||0)-(+get(y,COLS[4])||0);return get(x,COLS[0]).localeCompare(get(y,COLS[0]),'zh-Hant',{numeric:true})});return a}
function card(r){const k=keyFor(r),f=isFav(r),w=isWatched(r);const details=[[ '年份',COLS[3] ],['集數',COLS[4]],['語言',COLS[5]],['主要演員／聲優',COLS[6]]].filter(([_,c])=>get(r,c)).map(([l,c])=>`<div><b>${l}：</b>${esc(get(r,c))}</div>`).join('');const chips=[...typeTags(r),...themeTags(r)].slice(0,7).map(x=>`<span class="chip">${esc(x)}</span>`).join('');return `<article class="item"><div class="chips">${get(r,COLS[7])?`<span class="chip">${esc(get(r,COLS[7]))}</span>`:''}${w?'<span class="chip">已觀看</span>':''}</div><h2>${esc(get(r,COLS[0])||'（未命名）')}</h2>${get(r,COLS[1])?`<div class="original">${esc(get(r,COLS[1]))}</div>`:''}<div class="chips">${chips}</div><div class="details">${details}</div><div class="locations">${get(r,COLS[8])?`<div>📁 <b>Backup 1：</b>${esc(get(r,COLS[8]))}</div>`:''}${get(r,COLS[9])?`<div>💾 <b>Backup 2：</b>${esc(get(r,COLS[9]))}</div>`:''}</div><div class="cardactions"><button data-action="fav" data-key="${esc(k)}" class="${f?'on':''}">${f?'★ 已收藏':'☆ 收藏'}</button><button data-action="watched" data-key="${esc(k)}" class="${w?'on':''}">${w?'✓ 已觀看':'標記已觀看'}</button><button type="button" class="google-search" data-title="${esc(get(r,COLS[0]))}" data-original="${esc(get(r,COLS[1]))}">🔎 Google 搜尋</button></div></article>`}
function render(){const a=filtered();$('totalCount').textContent=rows.length.toLocaleString();$('shownCount').textContent=a.length.toLocaleString();$('favCount').textContent=rows.filter(isFav).length.toLocaleString();$('resultLabel').textContent=rows.length?`顯示 ${a.length.toLocaleString()} / ${rows.length.toLocaleString()} 部作品`:'請先還原完整備份或更新雲端作品清單';$('results').innerHTML=a.length?a.map(card).join(''):`<div class="empty"><div style="font-size:32px;margin-bottom:8px">${rows.length?'🔎':'📂'}</div><b>${rows.length?'沒有符合條件的作品':'尚未載入資料'}</b><p>${rows.length?'試試其他關鍵字，或清除部分篩選。':'可在右上角「資料管理」匯入完整 JSON 備份、還原 Supabase 備份，或更新雲端作品清單。'}</p></div>`;$('results').style.gridTemplateColumns=listView?'1fr':''}
function resetFilters(){['search','typeFilter','themeFilter','actorFilter','languageFilter','yearFilter'].forEach(id=>$(id).value='');['favOnly','watchedOnly','unwatchedOnly'].forEach(id=>$(id).checked=false);render()}
const REMOTE_CSV_URL='https://raw.githubusercontent.com/imkwong60/dramalist/main/dramalist.csv';
$('updateCsvBtn').addEventListener('click',async()=>{
 const btn=$('updateCsvBtn');if(btn.disabled)return;btn.disabled=true;const oldText=btn.textContent;btn.textContent='更新中…';
 try{
  const response=await fetch(REMOTE_CSV_URL+'?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const csvText=await response.text();const parsed=parseCSV(csvText);
  if(!parsed.length)throw Error('CSV 空白');
  const headers=Object.keys(parsed[0]);
  if(!headers.includes('中文名稱'))throw Error('找不到「中文名稱」欄位，請確認 CSV 標題列');
  const nextRows=parsed.map(r=>{const o={};COLS.forEach(c=>o[c]=norm(r[c]));return o;}).filter(r=>COLS.some(c=>get(r,c)));
  if(!nextRows.length)throw Error('CSV 沒有可用作品');
  rows=nextRows;save();refreshOptions();resetFilters();
  toast('雲端 CSV 更新成功，共 '+rows.length.toLocaleString()+' 部作品；收藏及觀看紀錄已保留');
 }catch(err){toast('更新失敗：請檢查網絡或 GitHub CSV 是否公開。'+(err&&err.message==='Failed to fetch'?'（可能是網絡／跨域限制）':''));}
 finally{btn.disabled=false;btn.textContent=oldText;}
});
// 完整本機備份：作品 rows + 收藏/觀看 meta，一併存為 JSON。
function makeFullBackup(){return {app:'dramalist-pwa',version:1,backupAt:new Date().toISOString(),columns:COLS,rows,meta}}
function downloadJSON(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('fullExportBtn').addEventListener('click',()=>{if(!rows.length){toast('目前沒有作品資料，無法備份');return}downloadJSON(makeFullBackup(),'dramalist-full-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('完整備份已匯出，包含收藏及觀看紀錄')});
$('backupJsonInput').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const payload=JSON.parse(await file.text());if(!payload||payload.app!=='dramalist-pwa'||!Array.isArray(payload.rows)||!payload.meta||typeof payload.meta!=='object')throw Error('這不是有效的影視資料庫完整備份 JSON');if(!confirm('匯入會取代目前本機作品、收藏及觀看紀錄。建議先匯出現有完整備份。要繼續嗎？'))return;const nextRows=payload.rows.map(r=>{const o={};COLS.forEach(c=>o[c]=norm(r[c]));return o});rows=nextRows;meta=payload.meta;save();refreshOptions();resetFilters();render();toast('完整備份還原成功：'+rows.length.toLocaleString()+' 部作品，收藏及觀看紀錄已還原')}catch(err){toast('匯入完整備份失敗：'+err.message)}finally{e.target.value=''}});

function getSBConfig(){try{return {...SB_DEFAULT,...JSON.parse(localStorage.getItem(SB_CFG_KEY)||'{}')}}catch{return {...SB_DEFAULT}}}
function setSBConfig(c){localStorage.setItem(SB_CFG_KEY,JSON.stringify(c))}
function askSBConfig(){const c=getSBConfig();const url=prompt('Supabase Project URL',c.url);if(url===null)return null;const key=prompt('Supabase anon/public key（切勿輸入 service_role/secret key）',c.key);if(key===null)return null;const backupId=prompt('沿用 public.notepad_data 的 id。請保持 dramalist，才能讀取既有備份。',c.backupId||'dramalist');if(backupId===null)return null;const cleanUrl=url.trim().replace(/\/$/,'');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(cleanUrl)||!key.trim()||backupId.trim()!=='dramalist'){toast('設定格式不正確；此版本必須使用現有備份 ID：dramalist');return null}const out={url:cleanUrl,key:key.trim(),backupId:'dramalist'};setSBConfig(out);toast('Supabase 設定已儲存在此裝置');return out}
function sbConfig(){const c=getSBConfig();if(c.url&&c.key&&c.backupId)return c;return askSBConfig()}
async function sbRequest(method,payload){const c=sbConfig();if(!c)return null;const headers={'apikey':c.key,'Authorization':'Bearer '+c.key,'Content-Type':'application/json','Accept':'application/json'};const base=c.url+'/rest/v1/notepad_data';if(method==='POST'){headers['Prefer']='resolution=merge-duplicates,return=minimal';const res=await fetch(base+'?on_conflict=id',{method:'POST',headers,body:JSON.stringify({id:'dramalist',data:payload,updated_at:new Date().toISOString()})});if(!res.ok)throw Error('Supabase 寫入失敗（HTTP '+res.status+'），請確認既有 notepad_data 的 RLS policy 允許 anon 寫入');return true}else{const res=await fetch(base+'?id=eq.dramalist&select=data,updated_at',{method:'GET',headers,cache:'no-store'});if(!res.ok)throw Error('Supabase 讀取失敗（HTTP '+res.status+'），請確認 URL、anon key 及 notepad_data 的 RLS policy');const data=await res.json();if(!data.length)throw Error('public.notepad_data 找不到 id=dramalist 的資料');return data[0]}}
$('supabaseConfigBtn').addEventListener('click',()=>askSBConfig());
$('supabaseBackupBtn').addEventListener('click',async()=>{if(!rows.length){toast('目前沒有作品資料，無法備份');return}const b=$('supabaseBackupBtn');b.disabled=true;const old=b.textContent;b.textContent='備份中…';try{const payload={app:'dramalist-pwa',version:1,backupAt:new Date().toISOString(),columns:COLS,rows,meta};await sbRequest('POST',payload);toast('完整備份已寫入現有 notepad_data（id=dramalist）：'+rows.length.toLocaleString()+' 部作品，包含收藏及觀看紀錄')}catch(e){toast('備份失敗：'+e.message)}finally{b.disabled=false;b.textContent=old}});
$('supabaseRestoreBtn').addEventListener('click',async()=>{if(!confirm('匯入雲端備份會取代目前本機作品、收藏及觀看紀錄。建議先備份目前資料。要繼續嗎？'))return;const b=$('supabaseRestoreBtn');b.disabled=true;const old=b.textContent;b.textContent='讀取中…';try{const rec=await sbRequest('GET');if(!rec)return;const payload=rec.data;if(!payload||payload.app!=='dramalist-pwa'||!Array.isArray(payload.rows)||!payload.meta||typeof payload.meta!=='object')throw Error('雲端備份格式不正確');rows=payload.rows.map(r=>{const o={};COLS.forEach(c=>o[c]=norm(r[c]));return o});meta=payload.meta;save();refreshOptions();resetFilters();render();toast('已還原雲端備份：'+rows.length.toLocaleString()+' 部作品（含收藏及觀看紀錄）')}catch(e){toast('還原失敗：'+e.message)}finally{b.disabled=false;b.textContent=old}});
$('results').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const r=rows.find(x=>keyFor(x)===b.dataset.key);if(!r)return;meta[b.dataset.key]=meta[b.dataset.key]||{};meta[b.dataset.key][b.dataset.action]=!meta[b.dataset.key][b.dataset.action];save();render()});
$('results').addEventListener('click',e=>{const b=e.target.closest('button.google-search');if(!b)return;const query=[b.dataset.title,b.dataset.original].filter(Boolean).join(' ');if(!query.trim())return;window.open('https://www.google.com/search?q='+encodeURIComponent(query),'_blank','noopener,noreferrer')});
['search','typeFilter','themeFilter','actorFilter','languageFilter','yearFilter','favOnly','watchedOnly','unwatchedOnly','sortSelect'].forEach(id=>$(id).addEventListener('input',render));$('resetBtn').addEventListener('click',resetFilters);$('viewBtn').addEventListener('click',()=>{listView=!listView;$('viewBtn').textContent=listView?'切換卡片':'切換列表';$('results').style.gridTemplateColumns=listView?'1fr':''});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installBtn').classList.remove('hidden')});$('installBtn').addEventListener('click',async()=>{if(!installPrompt){toast('請使用瀏覽器選單中的「安裝應用程式／加到主畫面」');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('installBtn').classList.add('hidden')});
load();if(!rows.length&&/^https?:$/.test(location.protocol)){fetch('./dramalist.csv').then(r=>{if(!r.ok)throw Error('no bundled csv');return r.text()}).then(t=>{const parsed=parseCSV(t);if(parsed.length){rows=parsed.map(r=>{const o={};COLS.forEach(c=>o[c]=norm(r[c]));return o});save();refreshOptions();render();toast('已自動載入內附 CSV 資料')}}).catch(()=>{});}refreshOptions();render();if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
