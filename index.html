<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="可離線使用的影視資料庫，支援搜尋、篩選、收藏及觀看狀態。"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>J.Law 影視資料庫</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c2f;--panel2:#1b2740;--text:#eef3ff;--muted:#aab7d0;--line:#2d3a55;--accent:#8bb7ff;--accent2:#c0d7ff;--good:#9be2c0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#10182b,var(--bg) 360px);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,select{font:inherit}button,.filebtn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:12px;cursor:pointer;min-height:42px}button.primary,.filebtn.primary{background:var(--accent);color:#0b1426;border-color:transparent;font-weight:700}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}header{padding:24px max(16px,calc((100vw - 1240px)/2)) 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:.02em}header p{color:var(--muted);margin:4px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.wrap{max-width:1240px;margin:auto;padding:0 16px 48px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 16px}.stat,.filters,.toolbar,.item{background:rgba(20,28,47,.94);border:1px solid var(--line);border-radius:16px}.stat{padding:13px 15px}.stat strong{font-size:23px;display:block}.stat span{font-size:12px;color:var(--muted)}.filters{padding:16px;margin-bottom:14px}.filtergrid{display:grid;grid-template-columns:2fr repeat(5,minmax(120px,1fr));gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select{width:100%;background:#0d1527;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;min-height:43px}.filterfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}.checkline{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}.checkline label{display:flex;align-items:center;gap:7px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;margin-bottom:12px;flex-wrap:wrap}.toolbar .left,.toolbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select{background:#0d1527;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.item{padding:15px;min-width:0;display:flex;flex-direction:column;gap:8px}.item h2{font-size:18px;line-height:1.35;margin:0;overflow-wrap:anywhere}.original{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12px;color:var(--accent2);border:1px solid #344a6b;background:#192943;padding:3px 8px;border-radius:999px}.details{font-size:13px;color:var(--muted);display:grid;gap:5px}.details b{color:#e6edfb;font-weight:600}.locations{border-top:1px solid var(--line);padding-top:9px;margin-top:auto;display:grid;gap:5px;font-size:13px}.cardactions{display:flex;gap:7px;margin-top:4px}.cardactions button{flex:1;font-size:13px;padding:7px 8px;min-height:38px}.on{color:var(--good)!important;border-color:#396f5d!important}.empty{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}.notice{font-size:12px;color:var(--muted);margin:12px 2px}.hidden{display:none!important}#csvInput{display:none}footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}.filebtn{display:inline-flex;align-items:center;justify-content:center}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#e8f0ff;color:#111827;border-radius:12px;padding:10px 16px;box-shadow:0 8px 30px #0008;z-index:5;max-width:90vw}
@media(max-width:900px){.filtergrid{grid-template-columns:repeat(3,minmax(0,1fr))}.filtergrid .searchfield{grid-column:1/-1}.results{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){header{padding:18px 14px 14px;align-items:flex-start}.actions{width:100%}.actions button,.actions .filebtn{flex:1}.wrap{padding:0 12px 32px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:19px}.stat span{font-size:11px}.filtergrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.filtergrid .searchfield{grid-column:1/-1}.filters{padding:12px}.results{grid-template-columns:1fr;gap:9px}.item{padding:14px}.toolbar{align-items:flex-start}.toolbar .left,.toolbar .right{width:100%;justify-content:space-between}.toolbar .right select{flex:1;min-width:0}.toolbar button{flex:1}.item h2{font-size:18px}.notice{line-height:1.5}}
</style></head>
<body><header><div><h1>🎬 J.Law 影視資料庫</h1><p>搜尋、篩選、管理你的劇集與備份位置</p></div><div class="actions"><label class="filebtn primary" for="csvInput">匯入 CSV</label><input id="csvInput" type="file" accept=".csv,text/csv"><button id="exportBtn">匯出資料</button><button id="installBtn" class="hidden">安裝 App</button></div></header>
<main class="wrap"><section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>資料庫作品</span></div><div class="stat"><strong id="shownCount">0</strong><span>目前篩選結果</span></div><div class="stat"><strong id="favCount">0</strong><span>我的收藏</span></div></section>
<section class="filters"><div class="filtergrid"><div class="field searchfield"><label for="search">關鍵字搜尋</label><input id="search" placeholder="劇名、原文、演員、類型、備份位置…" autocomplete="off"></div><div class="field"><label for="typeFilter">作品類型</label><select id="typeFilter"><option value="">全部作品類型</option></select></div><div class="field"><label for="actorFilter">演員／聲優</label><select id="actorFilter"><option value="">全部演員／聲優</option></select></div><div class="field"><label for="mediaFilter">Media Type</label><select id="mediaFilter"><option value="">全部媒體</option></select></div><div class="field"><label for="languageFilter">語言</label><select id="languageFilter"><option value="">全部語言</option></select></div><div class="field"><label for="yearFilter">年份</label><select id="yearFilter"><option value="">全部年份</option></select></div><div class="field"><label for="backupFilter">備份位置</label><select id="backupFilter"><option value="">全部位置</option></select></div></div><div class="filterfoot"><div class="checkline"><label><input id="favOnly" type="checkbox"> 只看收藏</label><label><input id="watchedOnly" type="checkbox"> 只看已觀看</label><label><input id="unwatchedOnly" type="checkbox"> 未觀看</label></div><button id="resetBtn">清除篩選</button></div></section>
<section class="toolbar"><div class="left"><span id="resultLabel">載入資料後開始使用</span></div><div class="right"><label for="sortSelect" class="hidden">排序</label><select id="sortSelect"><option value="title">按中文名稱排序</option><option value="yearDesc">年份：新到舊</option><option value="yearAsc">年份：舊到新</option><option value="episodesDesc">集數：多到少</option><option value="episodesAsc">集數：少到多</option></select><button id="viewBtn">切換列表</button></div></section>
<section id="results" class="results" aria-live="polite"></section><p class="notice">作品清單、收藏及觀看狀態均儲存在本機。請定期按「匯出資料」備份，避免清除瀏覽器資料後遺失。</p></main><footer>影視資料庫 PWA · 支援 CSV 匯入／匯出 · 本機資料優先</footer><div id="toast" class="toast hidden" role="status"></div>
<script>
const DBKEY='dramalist_pwa_v1', METAKEY='dramalist_meta_v1';
const COLS=['中文名稱','英文名稱 / 原文名稱','類形','年份','集數','語言','主要演員 / 聲優','Media Type','Backup 1','backup 2'];
let rows=[],meta={},listView=false,installPrompt=null;
const $=id=>document.getElementById(id);
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),2600)}
function norm(s){return String(s??'').trim()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let out=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))out.push(row);row=[];cell=''}else cell+=c}if(cell!==''||row.length){row.push(cell);if(row.some(x=>x.trim()!==''))out.push(row)}if(!out.length)return[];const headers=out.shift().map(x=>x.trim());return out.map(a=>Object.fromEntries(headers.map((h,i)=>[h,norm(a[i])])))}
function get(r,key){return norm(r[key])}
function keyFor(r){return [get(r,COLS[0]),get(r,COLS[1]),get(r,COLS[3])].join('|').toLowerCase()}
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(rows));localStorage.setItem(METAKEY,JSON.stringify(meta))}catch(e){toast('本機儲存空間不足，請匯出資料備份')}}
function load(){try{rows=JSON.parse(localStorage.getItem(DBKEY)||'[]');meta=JSON.parse(localStorage.getItem(METAKEY)||'{}')}catch{rows=[];meta={}}}
function options(id,values,first){const sel=$(id),prev=sel.value;sel.innerHTML=`<option value="">${first}</option>`+[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true})).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');if([...sel.options].some(o=>o.value===prev))sel.value=prev}
// 類形欄可能混有演員／其他標籤。重要：只認「完整標籤」符合清單的項目，不能用關鍵字包含判斷，否則愛情劇、校園劇等也會被錯當成作品大類。
const TYPE_ALIASES = new Map([
 ['電影','電影'],['電影版','電影'],['日影','電影'],['韓影','電影'],['港影','電影'],['台影','電影'],['國產電影','電影'],['movie','電影'],['movies','電影'],['film','電影'],['films','電影'],
 ['日劇','日劇'],['日本劇','日劇'],['韓劇','韓劇'],['韓國劇','韓劇'],['美劇','美劇'],['美國劇','美劇'],['台劇','台劇'],['台灣劇','台劇'],['港劇','港劇'],['香港劇','港劇'],['中劇','陸劇'],['陸劇','陸劇'],['中國劇','陸劇'],['泰劇','泰劇'],['英劇','英劇'],['法劇','法劇'],['德劇','德劇'],['網劇','網劇'],['電視劇','電視劇'],['短劇','短劇'],
 ['動畫','動畫'],['動漫','動畫'],['anime','動畫'],['ova','動畫'],['綜藝','綜藝'],['番組','綜藝'],['紀錄片','紀錄片'],['紀錄','紀錄片'],['特攝','特攝'],['舞台劇','舞台劇'],['劇場版','電影'],['tv show','電視節目'],['series','電視劇'],['drama','電視劇']
]);
function splitTags(v){return String(v||'').split(/[、,，;；|／\/]+/).map(x=>x.trim()).filter(Boolean)}
function canonicalType(tag){return TYPE_ALIASES.get(String(tag||'').trim().toLocaleLowerCase()) || TYPE_ALIASES.get(String(tag||'').trim()) || ''}
function typeTags(r){return [...new Set(splitTags(get(r,COLS[2])).map(canonicalType).filter(Boolean))]}
// 演員／聲優選項只從專用欄位取得，避免把題材標籤混入演員清單。
function actorTags(r){return [...new Set(splitTags(get(r,COLS[6])).map(x=>x.trim()).filter(Boolean))]}
function refreshOptions(){options('typeFilter',rows.flatMap(typeTags),'全部作品類型');options('actorFilter',rows.flatMap(actorTags),'全部演員／聲優');options('mediaFilter',rows.map(r=>get(r,COLS[7])),'全部媒體');options('languageFilter',rows.map(r=>get(r,COLS[5])),'全部語言');options('yearFilter',rows.map(r=>get(r,COLS[3])),'全部年份');options('backupFilter',rows.flatMap(r=>[get(r,COLS[8]),get(r,COLS[9])]),'全部位置')}
function isFav(r){return !!meta[keyFor(r)]?.fav}function isWatched(r){return !!meta[keyFor(r)]?.watched}
function filtered(){const q=$('search').value.trim().toLocaleLowerCase();let a=rows.filter(r=>{const all=COLS.map(k=>get(r,k)).join(' ').toLocaleLowerCase();const selectedType=$('typeFilter').value,selectedActor=$('actorFilter').value;return(!q||all.includes(q))&&(!selectedType||typeTags(r).includes(selectedType))&&(!selectedActor||actorTags(r).includes(selectedActor)||get(r,COLS[6]).includes(selectedActor))&&(!$('mediaFilter').value||get(r,COLS[7])===$('mediaFilter').value)&&(!$('languageFilter').value||get(r,COLS[5])===$('languageFilter').value)&&(!$('yearFilter').value||get(r,COLS[3])===$('yearFilter').value)&&(!$('backupFilter').value||get(r,COLS[8])===$('backupFilter').value||get(r,COLS[9])===$('backupFilter').value)&&(!$('favOnly').checked||isFav(r))&&(!$('watchedOnly').checked||isWatched(r))&&(!$('unwatchedOnly').checked||!isWatched(r))});const s=$('sortSelect').value;a.sort((x,y)=>{if(s==='yearDesc')return (+get(y,COLS[3])||0)-(+get(x,COLS[3])||0);if(s==='yearAsc')return (+get(x,COLS[3])||0)-(+get(y,COLS[3])||0);if(s==='episodesDesc')return (+get(y,COLS[4])||0)-(+get(x,COLS[4])||0);if(s==='episodesAsc')return (+get(x,COLS[4])||0)-(+get(y,COLS[4])||0);return get(x,COLS[0]).localeCompare(get(y,COLS[0]),'zh-Hant',{numeric:true})});return a}
function card(r){const k=keyFor(r),f=isFav(r),w=isWatched(r);const details=[[ '年份',COLS[3] ],['集數',COLS[4]],['語言',COLS[5]],['主要演員／聲優',COLS[6]]].filter(([_,c])=>get(r,c)).map(([l,c])=>`<div><b>${l}：</b>${esc(get(r,c))}</div>`).join('');const chips=typeTags(r).slice(0,7).map(x=>`<span class="chip">${esc(x)}</span>`).join('');return `<article class="item"><div class="chips">${get(r,COLS[7])?`<span class="chip">${esc(get(r,COLS[7]))}</span>`:''}${w?'<span class="chip">已觀看</span>':''}</div><h2>${esc(get(r,COLS[0])||'（未命名）')}</h2>${get(r,COLS[1])?`<div class="original">${esc(get(r,COLS[1]))}</div>`:''}<div class="chips">${chips}</div><div class="details">${details}</div><div class="locations">${get(r,COLS[8])?`<div>📁 <b>Backup 1：</b>${esc(get(r,COLS[8]))}</div>`:''}${get(r,COLS[9])?`<div>💾 <b>Backup 2：</b>${esc(get(r,COLS[9]))}</div>`:''}</div><div class="cardactions"><button data-action="fav" data-key="${esc(k)}" class="${f?'on':''}">${f?'★ 已收藏':'☆ 收藏'}</button><button data-action="watched" data-key="${esc(k)}" class="${w?'on':''}">${w?'✓ 已觀看':'標記已觀看'}</button><button type="button" class="google-search" data-title="${esc(get(r,COLS[0]))}" data-original="${esc(get(r,COLS[1]))}">🔎 Google 搜尋</button></div></article>`}
function render(){const a=filtered();$('totalCount').textContent=rows.length.toLocaleString();$('shownCount').textContent=a.length.toLocaleString();$('favCount').textContent=rows.filter(isFav).length.toLocaleString();$('resultLabel').textContent=rows.length?`顯示 ${a.length.toLocaleString()} / ${rows.length.toLocaleString()} 部作品`:'請先匯入你的 dramalist.csv';$('results').innerHTML=a.length?a.map(card).join(''):`<div class="empty"><div style="font-size:32px;margin-bottom:8px">${rows.length?'🔎':'📂'}</div><b>${rows.length?'沒有符合條件的作品':'尚未載入資料'}</b><p>${rows.length?'試試其他關鍵字，或清除部分篩選。':'按右上角「匯入 CSV」，選擇你的 dramalist.csv。'}</p>${rows.length?'':'<label class="filebtn primary" for="csvInput">選擇 CSV 檔案</label>'}</div>`;$('results').style.gridTemplateColumns=listView?'1fr':''}
function resetFilters(){['search','typeFilter','actorFilter','mediaFilter','languageFilter','yearFilter','backupFilter'].forEach(id=>$(id).value='');['favOnly','watchedOnly','unwatchedOnly'].forEach(id=>$(id).checked=false);render()}
$('csvInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=parseCSV(await f.text());if(!parsed.length)throw Error('CSV 沒有資料');const heads=Object.keys(parsed[0]);const titleKey=heads.find(h=>h==='中文名稱')||heads[0];if(!heads.includes('中文名稱')){toast('已匯入，但欄位名稱與預期不同；搜尋仍可用，請確認 CSV 標題列。')}const old=new Map(rows.map(r=>[keyFor(r),r]));rows=parsed.map(r=>{const normalized={};COLS.forEach(c=>normalized[c]=norm(r[c]));if(!normalized[COLS[0]])normalized[COLS[0]]=norm(r[titleKey]);return normalized});save();refreshOptions();resetFilters();toast(`成功匯入 ${rows.length} 部作品`)}catch(err){toast('匯入失敗：請確認係有效的 CSV 檔案')}e.target.value=''});
$('exportBtn').addEventListener('click',()=>{if(!rows.length){toast('目前沒有資料可匯出');return}const csv=[COLS,...rows.map(r=>COLS.map(c=>r[c]??''))].map(row=>row.map(v=>{v=String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');const blob=new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dramalist-export.csv';a.click();URL.revokeObjectURL(url);toast('已開始匯出 CSV')});
$('results').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const r=rows.find(x=>keyFor(x)===b.dataset.key);if(!r)return;meta[b.dataset.key]=meta[b.dataset.key]||{};meta[b.dataset.key][b.dataset.action]=!meta[b.dataset.key][b.dataset.action];save();render()});
$('results').addEventListener('click',e=>{const b=e.target.closest('button.google-search');if(!b)return;const query=[b.dataset.title,b.dataset.original].filter(Boolean).join(' ');if(!query.trim())return;window.open('https://www.google.com/search?q='+encodeURIComponent(query),'_blank','noopener,noreferrer')});
['search','typeFilter','actorFilter','mediaFilter','languageFilter','yearFilter','backupFilter','favOnly','watchedOnly','unwatchedOnly','sortSelect'].forEach(id=>$(id).addEventListener('input',render));$('resetBtn').addEventListener('click',resetFilters);$('viewBtn').addEventListener('click',()=>{listView=!listView;$('viewBtn').textContent=listView?'切換卡片':'切換列表';$('results').style.gridTemplateColumns=listView?'1fr':''});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installBtn').classList.remove('hidden')});$('installBtn').addEventListener('click',async()=>{if(!installPrompt){toast('請使用瀏覽器選單中的「安裝應用程式／加到主畫面」');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('installBtn').classList.add('hidden')});
load();if(!rows.length&&/^https?:$/.test(location.protocol)){fetch('./dramalist.csv').then(r=>{if(!r.ok)throw Error('no bundled csv');return r.text()}).then(t=>{const parsed=parseCSV(t);if(parsed.length){rows=parsed.map(r=>{const o={};COLS.forEach(c=>o[c]=norm(r[c]));return o});save();refreshOptions();render();toast('已自動載入內附 CSV 資料')}}).catch(()=>{});}refreshOptions();render();if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
